name: Loot Boost Android APK

on:
  push:
    branches:
      - mod-loot-boost-v4.0.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android 36 platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build installable APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :android:assembleDebug

      - name: Print artifact details
        run: |
          ls -lh android/build/outputs/apk/debug/android-debug.apk
          sha256sum android/build/outputs/apk/debug/android-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShatteredPD-v4.0.2-LootBoost-Android-APK
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
